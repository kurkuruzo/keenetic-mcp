<div id="clear-step-inline" aria-label="Ясный шаг — интерактивный прототип">
  <style>
    #clear-step-inline{--cs-bg:light-dark(#f3f6fa,#172131);--cs-paper:light-dark(#ffffff,#202d40);--cs-ink:light-dark(#172b45,#e4edf9);--cs-muted:light-dark(#596c83,#acbdd2);--cs-line:light-dark(#d9e2ee,#3a4c64);--cs-soft:light-dark(#e8eff9,#2b405e);--cs-accent:light-dark(#235cb9,#a9caff);--cs-action:light-dark(#235cb9,#a9caff);--cs-on:light-dark(#ffffff,#16263e);color:var(--cs-ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;--cs-space:20px;--cs-radius:10px}
    #clear-step-inline *{box-sizing:border-box}#clear-step-inline [hidden]{display:none!important}#clear-step-inline button,#clear-step-inline input,#clear-step-inline textarea,#clear-step-inline select{font:inherit;color:inherit}#clear-step-inline button{background:var(--cs-paper);border:1px solid var(--cs-line);border-radius:7px;padding:9px 13px;min-height:42px;cursor:var(--cursor-interaction,pointer)}#clear-step-inline button:hover{background:var(--cs-soft)}#clear-step-inline button:disabled{opacity:.5;cursor:default}#clear-step-inline button.cs-primary{background:var(--cs-action);border-color:var(--cs-action);color:var(--cs-on)}#clear-step-inline button.cs-quiet{border-color:transparent;background:transparent;color:var(--cs-accent)}#clear-step-inline button[aria-pressed=true]{background:var(--cs-soft);color:var(--cs-accent);border-color:var(--cs-accent)}#clear-step-inline h1,#clear-step-inline h2,#clear-step-inline h3,#clear-step-inline p{margin:0}#clear-step-inline h1{font-size:28px;line-height:1.25;letter-spacing:-.6px;font-weight:500}#clear-step-inline h2{font-size:19px;font-weight:500}#clear-step-inline h3{font-size:15px;font-weight:500}#clear-step-inline small{font-size:12px;color:var(--cs-muted)}#clear-step-inline .cs-muted{color:var(--cs-muted)}#clear-step-inline .cs-shell{background:var(--cs-bg);border:1px solid var(--cs-line);border-radius:var(--cs-radius);overflow:hidden}#clear-step-inline .cs-bar{padding:18px 110px 18px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;background:var(--cs-paper);border-bottom:1px solid var(--cs-line)}#clear-step-inline .cs-brand{font-size:21px;letter-spacing:-.5px;font-weight:500}#clear-step-inline .cs-brand small{display:block;letter-spacing:0;font-weight:400}#clear-step-inline .cs-layout{display:grid;grid-template-columns:160px minmax(0,1fr);min-height:485px}#clear-step-inline .cs-nav{padding:18px 12px;border-right:1px solid var(--cs-line);display:flex;flex-direction:column;gap:5px}#clear-step-inline .cs-nav button{text-align:left;border:0;background:transparent}#clear-step-inline .cs-nav button[aria-current=page]{background:var(--cs-paper);color:var(--cs-accent);font-weight:500}#clear-step-inline .cs-main{padding:26px;min-width:0}#clear-step-inline .cs-head{margin-bottom:23px;display:flex;gap:12px;justify-content:space-between;align-items:start;flex-wrap:wrap}#clear-step-inline .cs-head p{margin-top:7px;color:var(--cs-muted);font-size:14px}#clear-step-inline .cs-list{background:var(--cs-paper);border:1px solid var(--cs-line);border-radius:var(--cs-radius);overflow:hidden}#clear-step-inline .cs-row{padding:var(--cs-space);border-bottom:1px solid var(--cs-line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}#clear-step-inline .cs-row:last-child{border:0}#clear-step-inline .cs-grow{flex:1;min-width:140px;overflow-wrap:anywhere}#clear-step-inline .cs-row small{display:block;margin-top:5px}#clear-step-inline .cs-done{width:44px;min-height:44px;padding:8px;border-color:transparent;border-radius:50%;color:var(--cs-accent);font-size:23px}#clear-step-inline .cs-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:18px}#clear-step-inline .cs-row .cs-actions{margin:0}#clear-step-inline .cs-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}#clear-step-inline .cs-note{margin-top:20px;padding-left:15px;border-left:3px solid var(--cs-line);color:var(--cs-muted);font-size:13px}#clear-step-inline .cs-panel{background:var(--cs-paper);padding:22px;border:1px solid var(--cs-line);border-radius:var(--cs-radius)}#clear-step-inline label{display:block;margin:15px 0;font-size:14px}#clear-step-inline input,#clear-step-inline textarea,#clear-step-inline select{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--cs-line);background:var(--cs-paper);border-radius:7px}#clear-step-inline textarea{resize:vertical;min-height:85px}#clear-step-inline .cs-capture{padding:20px 24px;background:var(--cs-soft);border-bottom:1px solid var(--cs-line)}#clear-step-inline .cs-capture form{max-width:660px}#clear-step-inline .cs-capture label{margin-top:0}#clear-step-inline .cs-source{padding:15px;background:var(--cs-soft);border-radius:7px;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 20px}#clear-step-inline .cs-status{padding:11px 22px;background:var(--cs-paper);border-top:1px solid var(--cs-line);color:var(--cs-muted);font-size:12px;min-height:41px}#clear-step-inline .cs-results{margin-top:20px}#clear-step-inline .cs-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}#clear-step-inline .cs-two label{margin:10px 0}#clear-step-inline .cs-detail{margin:20px 0}#clear-step-inline .cs-detail p{margin-top:8px;color:var(--cs-muted);white-space:pre-wrap}#clear-step-inline .cs-progress{height:5px;background:var(--cs-soft);margin:20px 0;border-radius:5px;overflow:hidden}#clear-step-inline .cs-progress span{display:block;height:100%;background:var(--cs-accent)}#clear-step-inline .cs-focus{text-align:center;padding:32px 20px}#clear-step-inline .cs-focus h1{margin:25px auto;max-width:28ch}#clear-step-inline .cs-focus .cs-actions{justify-content:center}#clear-step-inline .cs-focus p{max-width:50ch;margin:auto}#clear-step-inline .cs-empty{padding:30px 20px;text-align:center}#clear-step-inline .cs-empty p{margin-top:10px}#clear-step-inline .cs-link{border:0;background:transparent;text-align:left;padding:0;min-height:30px;color:var(--cs-ink)}#clear-step-inline .cs-summary{margin:20px 0;color:var(--cs-muted)}
    @media(max-width:650px){#clear-step-inline .cs-layout{display:block}#clear-step-inline .cs-nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--cs-line);padding:10px}#clear-step-inline .cs-nav button{font-size:13px;padding:8px 10px}#clear-step-inline .cs-main{padding:20px 14px}#clear-step-inline .cs-bar{padding:18px 100px 16px 16px}#clear-step-inline .cs-row{padding:16px 12px}#clear-step-inline .cs-two{grid-template-columns:1fr;gap:0}#clear-step-inline .cs-panel{padding:17px}#clear-step-inline .cs-row>.cs-actions{margin-left:0}#clear-step-inline h1{font-size:25px}}
    @media(pointer:coarse){#clear-step-inline button{min-height:44px}#clear-step-inline input,#clear-step-inline textarea,#clear-step-inline select{font-size:16px}}
  </style>
  <div class="cs-shell">
    <header class="cs-bar"><div class="cs-brand">Ясный шаг<small>Личное пространство</small></div><button type="button" class="cs-primary" data-cs="capture">＋ Записать мысль</button></header>
    <section class="cs-capture" hidden aria-label="Быстрая запись"><form data-form="capture"><label>Что занимает внимание?<textarea name="thought" maxlength="400" required placeholder="Мысль, обещание, вопрос…"></textarea></label><div class="cs-actions"><button class="cs-primary" type="submit">Во входящие</button><button type="button" class="cs-quiet" data-cs="close-capture">Закрыть</button></div></form></section>
    <div class="cs-layout"><nav class="cs-nav" aria-label="Разделы приложения"></nav><main class="cs-main"></main></div>
    <div class="cs-status" role="status" aria-live="polite">Демонстрационные данные · можно менять и дополнять</div>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('clear-step-inline');
    const main=root.querySelector('.cs-main'),nav=root.querySelector('.cs-nav'),status=root.querySelector('.cs-status');
    const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initial=()=>({version:1,page:'now',horizon:'now',next:20,project:'p1',focus:null,review:0,reviewMarks:[],reviewKind:'weekly',outputs:[],draft:'',kind:'task',
      tasks:[{id:'t1',title:'Написать семье и предложить две даты поездки',project:'p1',horizon:'now',done:false},{id:'t2',title:'Открыть прототип и записать три замечания',project:'p2',horizon:'now',done:false},{id:'t3',title:'Уточнить у магазина дату доставки',project:'',horizon:'week',done:false}],
      inbox:[{id:'i1',text:'Обсудили отпуск: согласовать даты, выбрать жильё, созвониться в пятницу. Сохранить список мест рядом с парком.'},{id:'i2',text:'Найти гарантию на кофемашину: проверить письмо с чеком.'}],
      projects:[{id:'p1',title:'Семейная поездка',outcome:'Согласованы даты и забронировано подходящее всем жильё.',purpose:'Побыть вместе и сменить обстановку.',minimum:'Две ночи в удобном месте.',plan:'Согласовать даты → выбрать жильё → забронировать → собрать вещи.'},{id:'p2',title:'Моё приложение для задач',outcome:'Легко записываю мысли и выбираю следующий шаг на телефоне и компьютере.',purpose:'Меньше держать в голове.',minimum:'Надёжный путь от входящего до выполненного действия.',plan:'Проверить сценарии → реализовать хранение → синхронизация.'}],
      ideas:[{id:'a1',title:'Выходные в маленьком городе',reason:'Прогулки и смена обстановки без плотной программы.'}],
      materials:[{id:'m1',title:'Как выбрать следующий шаг',text:'Если путь непонятен, выпишите вопрос, на который нужно получить ответ.'}],events:[{id:'e1',title:'Созвон по поездке',date:'Пятница',time:'15:00'}]});
    let s=initial();
    const restore=w=>{const candidate=w?.privateContent?.app;if(candidate?.version===1&&Array.isArray(candidate.tasks)&&Array.isArray(candidate.inbox)&&Array.isArray(candidate.projects))s={...initial(),...candidate};};
    restore(window.openai?.widgetState);
    const uid=()=>`x${++s.next}`;
    const persist=()=>{const snapshot={modelContent:{screen:s.page,actions:s.tasks.filter(t=>!t.done).map(t=>t.title),inbox:s.inbox.length,reviewStep:s.review},privateContent:{app:s}};if(JSON.stringify(snapshot).length<14500)window.openai?.setWidgetState?.(snapshot)?.catch(()=>{});};
    const tell=t=>{status.textContent=t;};
    const labels={now:'Сейчас',inbox:'Входящие',projects:'Проекты',review:'Обзор',ideas:'Идеи',calendar:'Календарь',materials:'Материалы'};
    const types={task:'Действие',project:'Проект',event:'Встреча',material:'Материал',idea:'Идея'};
    const b=(a,t,id='',cls='')=>`<button type="button" class="${cls}" data-cs="${a}" data-id="${escape(id)}">${t}</button>`;
    const head=(title,sub)=>`<div class="cs-head"><div><h1>${title}</h1><p>${sub}</p></div></div>`;
    const pname=id=>s.projects.find(p=>p.id===id)?.title||'Личное';
    function rows(tasks){return `<div class="cs-list">${tasks.map(t=>`<div class="cs-row"><button type="button" class="cs-done" data-cs="done" data-id="${t.id}" aria-label="Выполнить: ${escape(t.title)}">○</button><div class="cs-grow"><button type="button" class="cs-link" data-cs="edit" data-id="${t.id}">${escape(t.title)}</button><small>${escape(pname(t.project))}</small></div><div class="cs-actions">${b('focus','Начать',t.id,'cs-quiet')}</div></div>`).join('')||'<div class="cs-empty"><h2>Можно оставить место свободным</h2><p class="cs-muted">Выберите действие из недели или сделайте паузу.</p></div>'}</div>`;}
    function render(){
      nav.innerHTML=Object.entries(labels).map(([key,label])=>`<button type="button" data-cs="page" data-id="${key}" ${s.page===key?'aria-current="page"':''}>${label}${key==='inbox'?` (${s.inbox.length})`:''}</button>`).join('');
      if(s.page==='now')main.innerHTML=head('Что можно сделать дальше?','Понятные действия. Без обязательной даты.')+`<div class="cs-tabs">${[['now','Сейчас'],['week','Неделя'],['later','Позже'],['done','Завершено']].map(([k,l])=>`<button type="button" data-cs="horizon" data-id="${k}" aria-pressed="${s.horizon===k}">${l}</button>`).join('')}</div>`+(s.horizon==='done'?`<div class="cs-list">${s.tasks.filter(t=>t.done).map(t=>`<div class="cs-row"><div class="cs-grow">${escape(t.title)}<small>Выполнено</small></div>${b('restore','Вернуть',t.id)}</div>`).join('')||'<div class="cs-empty">Завершённых действий пока нет.</div>'}</div>`:rows(s.tasks.filter(t=>!t.done&&t.horizon===s.horizon)))+`<div class="cs-actions">${b('new-task','＋ Следующее действие')}</div><p class="cs-note">Выбор на сейчас можно пересмотреть. Необязательно закончить весь список.</p>`;
      else if(s.page==='inbox'){
        const item=s.inbox[0];main.innerHTML=head('Разобрать входящие','Одна мысль может дать несколько результатов.')+(item?`<div class="cs-panel"><small>Запись 1 из ${s.inbox.length}</small><div class="cs-source">${escape(item.text)}</div><form data-form="process"><label>Что из этого следует?<select name="kind">${Object.entries(types).map(([k,l])=>`<option value="${k}" ${s.kind===k?'selected':''}>${l}</option>`).join('')}</select></label><label>Формулировка<textarea name="text" required maxlength="240" placeholder="Например: написать семье и предложить две даты">${escape(s.draft)}</textarea></label><div class="cs-two" ${s.kind==='event'?'':'hidden'}><label>Дата<input name="date" type="date"></label><label>Время<input name="time" type="time" value="15:00"></label></div><button type="submit">Добавить в результаты</button></form><div class="cs-results"><h3>Результаты разбора · ${s.outputs.length}</h3>${s.outputs.map((o,i)=>`<div class="cs-row"><div class="cs-grow"><small>${types[o.kind]}</small>${escape(o.text)}</div>${b('remove-output','Убрать',i,'cs-quiet')}</div>`).join('')}<div class="cs-actions"><button type="button" data-cs="process" class="cs-primary" ${s.outputs.length?'':'disabled'}>Завершить разбор</button>${b('discard','Не нужно','','cs-quiet')}</div></div></div>`:'<div class="cs-panel cs-empty"><h2>Всё разобрано</h2><p>Можно вернуться к действиям.</p></div>');
      }else if(s.page==='projects')main.innerHTML=head('Проекты','Результат впереди. Следующий шаг — под рукой.')+`<div class="cs-list">${s.projects.map(p=>`<div class="cs-row"><div class="cs-grow"><h2>${escape(p.title)}</h2><p class="cs-muted">${escape(p.outcome)}</p><small>${s.tasks.some(t=>t.project===p.id&&!t.done)?'Есть ближайшее действие':'Нужен следующий шаг'}</small></div>${b('project','Открыть',p.id)}</div>`).join('')}</div><div class="cs-actions">${b('new-project','＋ Проект')}</div>`;
      else if(s.page==='project'){
        const p=s.projects.find(p=>p.id===s.project);main.innerHTML=b('page','‹ Все проекты','projects','cs-quiet')+head(escape(p.title),escape(p.outcome))+rows(s.tasks.filter(t=>t.project===p.id&&!t.done))+`<div class="cs-actions">${b('new-task','＋ Ближайший шаг',p.id)}</div><div class="cs-detail"><h3>Что это даст?</h3><p>${escape(p.purpose||'Можно уточнить по мере работы.')}</p></div><div class="cs-detail"><h3>Минимально полезный результат</h3><p>${escape(p.minimum||'Какой маленький результат уже будет полезен?')}</p></div><details class="cs-panel"><summary>План — справочная информация</summary><p class="cs-summary">${escape(p.plan||'Полный план пока не нужен.')}</p></details>`;
      }else if(s.page==='focus'){
        const t=s.tasks.find(t=>t.id===s.focus);main.innerHTML=`<div class="cs-panel cs-focus"><small>Сейчас достаточно одного шага</small><h1>${escape(t?.title||'Выберите действие')}</h1><p class="cs-muted">${escape(pname(t?.project))}</p><div class="cs-actions">${b('finish-focus','Действие выполнено','','cs-primary')}${b('capture','Записать отвлечение')}</div><div class="cs-actions">${b('page','Вернуться к списку','now','cs-quiet')}</div></div>`;
      }else if(s.page==='review'){
        const steps=reviewSteps();const done=s.review>=steps.length;
        main.innerHTML=head('Обзор системы','Обновить планы и освободить голову.')+`<div class="cs-tabs">${[['daily','Ежедневный'],['weekly','Еженедельный']].map(([k,l])=>`<button type="button" data-cs="review-kind" data-id="${k}" aria-pressed="${s.reviewKind===k}">${l}</button>`).join('')}</div>`+(done?`<div class="cs-panel"><h2>${s.reviewMarks.includes('skipped')?'Частичный обзор сохранён':'Обзор завершён'}</h2><p class="cs-summary">Можно вернуться к работе или сделать паузу.</p>${b('page','К действиям','now','cs-primary')}</div>`:`<div class="cs-panel"><small>Шаг ${s.review+1} из ${steps.length}</small><div class="cs-progress"><span style="width:${s.review/steps.length*100}%"></span></div><h2>${steps[s.review][0]}</h2><p class="cs-summary">${steps[s.review][1]}</p>${b('page','Открыть: '+labels[steps[s.review][2]],steps[s.review][2])}<div class="cs-actions">${b('review-next',s.review===steps.length-1?'Завершить обзор':'Проверено, дальше','','cs-primary')}${b('review-skip','Пропустить','','cs-quiet')}</div></div>`);
      }else if(s.page==='ideas')main.innerHTML=head('Идеи','Интерес — ещё не обязательство.')+`<div class="cs-list">${s.ideas.map(i=>`<div class="cs-row"><div class="cs-grow"><h2>${escape(i.title)}</h2><p class="cs-muted">${escape(i.reason)}</p><small>${i.reviewed?'Пересмотрено':'Можно спокойно обдумать'}</small><div class="cs-actions">${b('idea-reviewed','Оставить',i.id)}${b('idea-project','Создать проект',i.id)}${b('archive','Отпустить',i.id,'cs-quiet')}</div></div></div>`).join('')||'<div class="cs-empty">В инкубаторе пока пусто.</div>'}</div>`;
      else if(s.page==='calendar')main.innerHTML=head('Календарь','Время, которое вы уже решили чему-то посвятить.')+`<div class="cs-list">${s.events.map(e=>`<div class="cs-row"><div><small>${escape(e.date)}</small>${escape(e.time)}</div><div class="cs-grow">${escape(e.title)}</div></div>`).join('')}</div><p class="cs-note">Гибкие действия живут в своём списке. Встречу можно добавить при разборе входящего.</p>`;
      else if(s.page==='materials')main.innerHTML=head('Материалы','Информация без обязательства что-то выполнить.')+`<div class="cs-list">${s.materials.map(m=>`<div class="cs-row"><div class="cs-grow"><h2>${escape(m.title)}</h2><p class="cs-muted">${escape(m.text)}</p></div></div>`).join('')}</div>`;
    }
    function reviewSteps(){return s.reviewKind==='daily'?[['Что следует за сделанным?','Посмотрите результаты и при необходимости запишите следующий шаг.','now'],['Что стоит пересмотреть?','Уточните или отпустите то, что снова откладывается.','now'],['Что учесть завтра?','Посмотрите встречи и выберите посильные действия.','calendar']]:[['Где осталось необдуманное?','Проверьте входящие и свои заметки. Старый архив можно разбирать небольшими порциями.','inbox'],['Все действия по-прежнему нужны?','Переформулируйте, перенесите или отмените ненужное.','now'],['У проектов есть следующий шаг?','Полного плана не требуется. Достаточно действия, которое поможет продвинуться.','projects'],['Что понадобится в ближайшие дни?','Посмотрите календарь и оставьте место для личного и отдыха.','calendar']];}
    function editTask(id='',project=''){
      const t=s.tasks.find(t=>t.id===id);main.innerHTML=head(t?'Уточнить действие':'Следующее действие','Что можно начать без дополнительных расшифровок?')+`<form data-form="task" data-id="${id}" class="cs-panel"><label>Формулировка<input name="title" maxlength="240" value="${escape(t?.title||'')}" required></label><label>Проект<select name="project"><option value="">Без проекта</option>${s.projects.map(p=>`<option value="${p.id}" ${(t?.project||project)===p.id?'selected':''}>${escape(p.title)}</option>`).join('')}</select></label><label>Горизонт<select name="horizon">${[['now','Сейчас'],['week','Неделя'],['later','Позже']].map(([k,l])=>`<option value="${k}" ${(t?.horizon||'later')===k?'selected':''}>${l}</option>`).join('')}</select></label><div class="cs-actions"><button type="submit" class="cs-primary">Сохранить действие</button>${b('page','Отмена','now','cs-quiet')}</div></form>`;
    }
    function newProject(idea){main.innerHTML=head('Новый проект','Начните с полезного результата.')+`<form data-form="project" data-idea="${idea?.id||''}" class="cs-panel"><label>Название<input name="title" required maxlength="160" value="${escape(idea?.title||'')}"></label><label>Что должно получиться?<textarea name="outcome" required maxlength="300"></textarea></label><label>Что это даст?<input name="purpose" maxlength="240" value="${escape(idea?.reason||'')}"></label><div class="cs-actions"><button type="submit" class="cs-primary">Создать проект</button>${b('page','Отмена','projects','cs-quiet')}</div></form>`;}
    root.addEventListener('click',e=>{const btn=e.target.closest('[data-cs]');if(!btn)return;const a=btn.dataset.cs,id=btn.dataset.id;let redraw=true;
      if(a==='page')s.page=id;
      else if(a==='horizon')s.horizon=id;
      else if(a==='capture'){root.querySelector('.cs-capture').hidden=false;root.querySelector('[name=thought]').focus();redraw=false;}
      else if(a==='close-capture'){root.querySelector('.cs-capture').hidden=true;redraw=false;}
      else if(a==='done'){s.tasks.find(t=>t.id===id).done=true;tell('Действие выполнено. Вернуть его можно в «Завершено».');}
      else if(a==='restore'){s.tasks.find(t=>t.id===id).done=false;tell('Действие возвращено.');}
      else if(a==='focus'){s.focus=id;s.page='focus';}
      else if(a==='finish-focus'){const t=s.tasks.find(t=>t.id===s.focus);if(t)t.done=true;s.page='now';tell('Шаг выполнен. Можно сделать паузу.');}
      else if(a==='edit'){editTask(id);redraw=false;}
      else if(a==='new-task'){editTask('',id);redraw=false;}
      else if(a==='project'){s.project=id;s.page='project';}
      else if(a==='new-project'){newProject();redraw=false;}
      else if(a==='remove-output')s.outputs.splice(Number(id),1);
      else if(a==='process'){
        if(!s.outputs.length)return;const source=s.inbox.shift();const n=s.outputs.length;
        for(const o of s.outputs){const key=uid();if(o.kind==='task')s.tasks.push({id:key,title:o.text,project:'',horizon:'later',done:false});if(o.kind==='project')s.projects.push({id:key,title:o.text,outcome:o.text});if(o.kind==='idea')s.ideas.push({id:key,title:o.text,reason:source.text});if(o.kind==='material')s.materials.push({id:key,title:o.text,text:source.text});if(o.kind==='event')s.events.push({id:key,title:o.text,date:o.date,time:o.time});}s.outputs=[];s.draft='';tell(`Разбор завершён: ${n} результатов. Новые действия — в «Позже».`);
      }else if(a==='discard'){s.inbox.shift();s.outputs=[];s.draft='';tell('Входящая запись убрана из демонстрации.');}
      else if(a==='review-kind'){s.reviewKind=id;s.review=0;s.reviewMarks=[];}
      else if(a==='review-next'||a==='review-skip'){s.reviewMarks.push(a==='review-next'?'done':'skipped');s.review++;}
      else if(a==='idea-reviewed'){s.ideas.find(i=>i.id===id).reviewed=true;tell('Идея пересмотрена. Обязательств не добавлено.');}
      else if(a==='idea-project'){newProject(s.ideas.find(i=>i.id===id));redraw=false;}
      else if(a==='archive'){s.ideas=s.ideas.filter(i=>i.id!==id);tell('Идея отпущена.');}
      if(redraw)render();persist();
    });
    root.addEventListener('input',e=>{if(e.target.name==='text'&&e.target.closest('[data-form=process]'))s.draft=e.target.value;});
    root.addEventListener('change',e=>{if(e.target.name==='kind'){s.kind=e.target.value;const fields=main.querySelector('.cs-two');if(fields)fields.hidden=s.kind!=='event';persist();}});
    root.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f),v=k=>String(d.get(k)||'').trim();
      if(f.dataset.form==='capture'){if(!v('thought'))return;s.inbox.push({id:uid(),text:v('thought')});f.reset();root.querySelector('.cs-capture').hidden=true;tell('Мысль записана во входящие.');}
      if(f.dataset.form==='process'){if(!v('text'))return;if(v('kind')==='event'&&(!v('date')||!v('time'))){tell('Для встречи укажите дату и время.');return;}s.outputs.push({kind:v('kind'),text:v('text'),date:v('date'),time:v('time')});s.draft='';tell('Результат добавлен. Можно добавить ещё один.');}
      if(f.dataset.form==='task'){if(!v('title'))return;const t=s.tasks.find(t=>t.id===f.dataset.id);const values={title:v('title'),project:v('project'),horizon:v('horizon')};if(t)Object.assign(t,values);else s.tasks.push({id:uid(),...values,done:false});s.page='now';s.horizon=v('horizon');tell('Действие сохранено.');}
      if(f.dataset.form==='project'){if(!v('title')||!v('outcome'))return;const id=uid();s.projects.push({id,title:v('title'),outcome:v('outcome'),purpose:v('purpose')});if(f.dataset.idea)s.ideas=s.ideas.filter(i=>i.id!==f.dataset.idea);s.project=id;s.page='project';tell('Проект создан. Выберите ближайший шаг.');}
      render();persist();
    });
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
    render();
    const design={spacing:20,radius:10};
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--cs-space',design.spacing+'px');root.style.setProperty('--cs-radius',design.radius+'px');}});tweak.addSlider(design,'spacing',{label:'Воздух между действиями',min:12,max:28,unit:'px'});tweak.addSlider(design,'radius',{label:'Скругление поверхностей',min:0,max:16,unit:'px'});}
  })();
  </script>
</div>
